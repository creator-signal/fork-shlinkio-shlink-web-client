name: Creator Signal CI

on:
  pull_request:
    branches:
      - creator-signal/develop
      - creator-signal/main
  push:
    branches:
      - creator-signal/develop
      - creator-signal/main

permissions:
  contents: read

concurrency:
  group: creator-signal-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Creator Signal application
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.x
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Check code style
        run: npm run cs
      - name: Check TypeScript
        run: npm run types
      - name: Run tests
        run: npm run test:ci
      - name: Build the production application
        run: npm run build

  container:
    name: Creator Signal container
    needs: application
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build the container without publishing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          push: false
          platforms: linux/amd64
          tags: creator-signal/shlink-web-client:ci-${{ github.sha }}
          build-args: |
            VERSION=ci-${{ github.sha }}
          cache-from: type=gha,scope=creator-signal-web-client
          cache-to: type=gha,mode=max,scope=creator-signal-web-client
      - name: Scan the built container
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.73.0
          image-ref: creator-signal/shlink-web-client:ci-${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
